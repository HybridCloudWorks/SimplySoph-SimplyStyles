name: CI/CD - Build, Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual runs also deploy Cloud Functions (see the deploy-functions job).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Analyze code
        run: flutter analyze
      
      - name: Run tests
        run: flutter test --coverage
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info

  build-web:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Build web
        run: flutter build web --release
      
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web/

  build-android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Build APK
        run: flutter build apk --release
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # Cloud Functions checks on every PR and push to main. Needs no secrets or
  # cloud credentials: npm ci, lint (node --check), tests if any, then the
  # same function discovery that "firebase deploy" runs, against a stub
  # project, to prove index.js loads and exports the expected functions.
  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test --if-present

      - name: Load check (function discovery)
        env:
          # Stub project so index.js can load without credentials:
          # initializeApp() and the storage trigger's default bucket read it.
          GCLOUD_PROJECT: demo-simplystyles
          FIREBASE_CONFIG: '{"projectId":"demo-simplystyles","storageBucket":"demo-simplystyles.appspot.com"}'
          FUNCTIONS_MANIFEST_OUTPUT_PATH: ${{ runner.temp }}/functions-manifest.json
        run: |
          ./node_modules/.bin/firebase-functions
          node - "$FUNCTIONS_MANIFEST_OUTPUT_PATH" <<'EOF'
          const fs = require('fs');
          const endpoints = JSON.parse(fs.readFileSync(process.argv[2], 'utf8')).endpoints || {};
          const expected = {
            vortex_analyzeItem: 'callableTrigger',
            vortex_generatePersonas: 'callableTrigger',
            vortex_calculateFit: 'callableTrigger',
            vortex_updateDailyTrends: 'scheduleTrigger',
            onImageUpload: 'eventTrigger',
            scanItemWithVision: 'callableTrigger',
            getFashionTrends: 'callableTrigger',
            searchShein: 'callableTrigger',
            searchZappos: 'callableTrigger',
          };
          const errors = [];
          const got = Object.keys(endpoints).sort();
          const want = Object.keys(expected).sort();
          if (got.join() !== want.join()) {
            errors.push(`exported functions are [${got.join(', ')}], expected [${want.join(', ')}]`);
          }
          for (const [name, trigger] of Object.entries(expected)) {
            const e = endpoints[name];
            if (!e) continue;
            if (!e[trigger]) errors.push(`${name} has no ${trigger}`);
            if (e.platform !== 'gcfv2') errors.push(`${name} platform is ${e.platform}, expected gcfv2`);
            if (JSON.stringify(e.region) !== '["us-central1"]') errors.push(`${name} region is ${JSON.stringify(e.region)}`);
          }
          if (errors.length) {
            for (const m of errors) console.log(`::error title=functions manifest::${m}`);
            process.exit(1);
          }
          console.log(`OK: ${got.length} functions discovered: ${got.join(', ')}`);
          EOF

  # Manual Cloud Functions deploy: workflow_dispatch from main only.
  #
  # Firebase project simplysoph-66c78 is shared with the live SimplySoph
  # website (HybridCloudWorks/SimplySoph-SimplySoph). Its Hosting site,
  # Firestore rules and Storage rules belong to that website, so this repo
  # never deploys hosting, firestore or storage there.
  #
  # This app's functions live in their own Firebase codebase, "simplystyles"
  # (firebase.json). "--only functions:simplystyles" creates, updates and
  # deletes only functions in that codebase, and the website's
  # "--only functions --force" deploy of its "default" codebase leaves them
  # alone. No --force here: removing a function from index.js makes the
  # deploy stop instead of deleting it (use "firebase functions:delete").
  #
  # Auth is keyless (GitHub OIDC to Workload Identity Federation). The repo
  # variables come from scripts/setup-functions-deploy-identity.ps1; see
  # docs/Deployment.md.
  deploy-functions:
    needs: [test, functions]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write # OIDC token for Workload Identity Federation
    concurrency:
      group: deploy-functions-simplystyles
      cancel-in-progress: false
    env:
      FIREBASE_PROJECT: simplysoph-66c78
    steps:
      - name: Check keyless deploy configuration
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          missing=""
          [ -n "$WIF_PROVIDER" ] || missing="$missing GCP_WORKLOAD_IDENTITY_PROVIDER"
          [ -n "$WIF_SERVICE_ACCOUNT" ] || missing="$missing GCP_SERVICE_ACCOUNT"
          if [ -n "$missing" ]; then
            echo "::error title=Keyless deploy is not set up::Missing repository variable(s):$missing. Run scripts/setup-functions-deploy-identity.ps1 once (see docs/Deployment.md), then run this workflow again."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          # No dependency cache in the job that holds deploy credentials.
          package-manager-cache: false

      - name: Install Cloud Functions dependencies
        run: npm ci --prefix functions

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Deploy the simplystyles functions codebase
        run: npx --yes firebase-tools@15.32.1 deploy --only functions:simplystyles --project "$FIREBASE_PROJECT" --non-interactive
