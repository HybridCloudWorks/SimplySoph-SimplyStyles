name: CI/CD - Build, Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual runs also deploy Cloud Functions (see the deploy-functions job).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Analyze code
        run: flutter analyze
      
      - name: Run tests
        run: flutter test --coverage
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info

  build-web:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Build web
        run: flutter build web --release
      
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web/

  build-android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Build APK
        run: flutter build apk --release
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # WARNING: Firebase project simplysoph-66c78 is shared with the live
  # SimplySoph website (HybridCloudWorks/SimplySoph-SimplySoph). Its default
  # Hosting site, Firestore rules and Storage rules belong to that website, so
  # this repo must never deploy hosting, firestore or storage there: it would
  # overwrite the website. Both repos also use the "default" functions codebase,
  # so this job deploys only this app's functions by name and never uses
  # --force (a plain "--only functions" would try to delete the website's
  # functions). The website's own functions deploy uses --force and can remove
  # these functions again until SimplyStyles gets its own codebase or project.
  deploy-functions:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    env:
      # Long-lived CI token; still needed until the project uses keyless
      # (Workload Identity Federation) login.
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cloud Functions dependencies
        run: npm ci --prefix functions

      - name: Deploy Cloud Functions only
        run: |
          npm install -g firebase-tools
          firebase deploy --non-interactive --project simplysoph-66c78 --token "$FIREBASE_TOKEN" \
            --only "functions:vortex_analyzeItem,functions:vortex_generatePersonas,functions:vortex_calculateFit,functions:vortex_updateDailyTrends,functions:onImageUpload,functions:scanItemWithVision,functions:getFashionTrends,functions:searchShein,functions:searchZappos"
