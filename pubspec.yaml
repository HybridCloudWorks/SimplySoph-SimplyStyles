name: simplystyles
description: An AI-powered wardrobe assistant for Gen Z fashionistas
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  firebase_storage: ^13.0.4
  cloud_functions: ^6.0.4
  
  # Authentication
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1

  # State Management
  provider: ^6.1.2

  # Image Handling
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  image: ^4.3.0

  # Barcode Scanning
  mobile_scanner: ^7.1.3

  # HTTP
  http: ^1.2.2

  # Utilities
  path: ^1.9.0
  uuid: ^4.5.1

  # UI
  cupertino_icons: ^1.0.8
  algoliasearch: ^1.41.0
  stream_chat_flutter: ^9.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  firebase_auth_mocks: ^0.15.1
  google_sign_in_mocks: ^0.4.1
  fake_cloud_firestore: ^4.0.0
  build_runner: ^2.4.10
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  
  fonts:
    - family: HappyMonkey
      fonts:
        - asset: fonts/HappyMonkey-Regular.ttf
