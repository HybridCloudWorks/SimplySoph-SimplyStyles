name: simplystyles
description: An AI-powered wardrobe assistant for Gen Z fashionistas
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  firebase_storage: ^13.0.6
  cloud_functions: ^6.0.6

  # Authentication
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.1

  # State Management
  provider: ^6.1.2

  # Image Handling
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1
  image: ^4.1.7

  # Barcode Scanning
  mobile_scanner: ^5.1.1

  # HTTP
  http: ^1.2.1

  # Utilities
  path: ^1.9.0
  uuid: ^4.4.0
  shared_preferences: ^2.2.3

  # UI
  cupertino_icons: ^1.0.8
  algoliasearch: ^1.33.0
  stream_chat_flutter: ^9.23.0
  camera: ^0.11.0+1
  google_mlkit_pose_detection: ^0.12.0
  share_plus: ^12.0.0
  adaptive_theme: ^3.6.0
  firebase_core_platform_interface: ^6.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Mocks
  firebase_auth_mocks: ^0.15.1
  google_sign_in_mocks: ^0.3.0
  fake_cloud_firestore: ^4.0.1
  firebase_storage_mocks: ^0.8.0

  build_runner: ^2.4.9
  mockito: ^5.6.3
  flutter_launcher_icons: ^0.13.1
  integration_test:
    sdk: flutter

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true

  fonts:
    - family: HappyMonkey
      fonts:
        - asset: fonts/HappyMonkey-Regular.ttf
